name: effective-mobile-dev
services:
  redis:
    extends:
      file: compose.yaml
      service: redis
    volumes: !override
      - redis_data_dev:/data
    networks: !override [ effective-mobile-dev ]

  db:
    extends:
      file: compose.yaml
      service: db
    volumes: !override
      - pg_data_dev:/var/lib/postgresql/data
    networks: !override [ effective-mobile-dev ]

  backend:
    image: effective-mobile-backend:latest-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file: !override
      - ./build/configs/envs/.env.dev
    extends:
      file: compose.yaml
      service: backend
    networks: !override [ effective-mobile-dev ]
    develop:
      watch: !override
        - action: sync
          path: backend
          target: /app
          ignore:
            - .git
            - vendor

  jaeger:
    extends:
      service: jaeger
      file: compose.yaml
    networks: !override [ effective-mobile-dev ]

  prometheus:
    extends:
      service: prometheus
      file: compose.yaml
    volumes: !override
      - ./build/configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data_dev:/prometheus
    networks: !override [ effective-mobile-dev ]

  node-exp:
    extends:
      service: node-exp
      file: compose.yaml
    networks: !override [ effective-mobile-dev ]

  grafana:
    extends:
      service: grafana
      file: compose.yaml
    volumes: !override
      - grafana_data_dev:/var/lib/grafana
      - ./build/configs/grafana/provisioning:/etc/grafana/provisioning:ro
    networks: !override [ effective-mobile-dev ]

  loki:
    extends:
      service: loki
      file: compose.yaml
    volumes: !override
      - loki_data_dev:/loki
      - ./build/configs/loki:/etc/loki
    networks: !override [ effective-mobile-dev ]

  promtail:
    extends:
      service: promtail
      file: compose.yaml
    networks: !override [ effective-mobile-dev ]

  postgres-exporter:
    extends:
      service: postgres-exporter
      file: compose.yaml
    networks: !override [ effective-mobile-dev ]

  redis-exporter:
    extends:
      service: redis-exporter
      file: compose.yaml
    networks: !override [ effective-mobile-dev ]

volumes:
  pg_data_dev:
  redis_data_dev:
  prometheus_data_dev:
  grafana_data_dev:
  loki_data_dev:

networks:
  effective-mobile-dev:
    name: effective-mobile-dev
